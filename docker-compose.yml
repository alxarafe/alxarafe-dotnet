services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alxarafe
      POSTGRES_USER: alxarafe
      POSTGRES_PASSWORD: alxarafe_dev_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-security.sql:ro
    healthcheck:
      # The initdb temporary server only accepts Unix-socket connections.
      # TCP readiness means initialization has finished and the final server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U alxarafe -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [alxarafe]

  app:
    image: alxarafe-dotnet-app
    build:
      context: .
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=alxarafe;Username=alxarafe;Password=alxarafe_dev_only
      Tenancy__DevelopmentBootstrap: "true"
      ConnectionStrings__Tenant_development: Host=postgres;Port=5432;Database=alxarafe_business;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__Security: Host=postgres;Port=5432;Database=alxarafe_security;Username=alxarafe;Password=alxarafe_dev_only
      SecuritySeed__AdminEmail: ${ERBAS_CORE_ADMIN_EMAIL:-admin@example.test}
      SecuritySeed__AdminPassword: ${ERBAS_CORE_ADMIN_PASSWORD:-}
      Wms__DevelopmentUser__Email: ${ERBAS_WMS_USER_EMAIL:-}
      Wms__DevelopmentUser__Password: ${ERBAS_WMS_USER_PASSWORD:-}
      AI__Groq__ApiKey: ${AI_GROQ_API_KEY:-}
      AI__Provider: ${AI_PROVIDER:-groq}
      AI__Model: ${AI_MODEL:-${AI_GROQ_MODEL:-qwen/qwen3.8-27b}}
      AI__Groq__BaseUrl: ${AI_GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      AI__Groq__TimeoutSeconds: ${AI_GROQ_TIMEOUT_SECONDS:-60}
      AI__Ollama__BaseUrl: ${AI_OLLAMA_BASE_URL:-http://127.0.0.1:11434/v1}
      AI__Ollama__TimeoutSeconds: ${AI_OLLAMA_TIMEOUT_SECONDS:-1800}
    ports:
      - "127.0.0.1:${ERBAS_DOTNET_PORT:-48081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    networks: [alxarafe]

  validation-app:
    image: alxarafe-dotnet-app
    profiles: [validation]
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      Modules__ConformanceEnabled: "true"
      ConnectionStrings__Platform: Host=postgres;Port=5432;Database=alxarafe_test;Username=alxarafe;Password=alxarafe_dev_only
      Tenancy__DevelopmentBootstrap: "true"
      ConnectionStrings__Tenant_development: Host=postgres;Port=5432;Database=alxarafe_business_test;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__Tenant_test_b: Host=postgres;Port=5432;Database=alxarafe_business_test_b;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__Security: Host=postgres;Port=5432;Database=alxarafe_security_test;Username=alxarafe;Password=alxarafe_dev_only
      SecuritySeed__AdminEmail: ${ERBAS_CORE_ADMIN_EMAIL:-admin@example.test}
      SecuritySeed__AdminPassword: ${ERBAS_CORE_ADMIN_PASSWORD:-}
    command: ["dotnet", "run", "--no-launch-profile", "--no-build", "--project", "src/Alxarafe.Host/Alxarafe.Host.csproj", "--urls", "http://0.0.0.0:8080"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks: [alxarafe]

  bruno:
    image: usebruno/cli:4.2.0
    profiles: [tools]
    working_dir: /workspace/api-tests/platform
    volumes:
      - .:/workspace:ro
    command: ["run", ".", "--env", "docker"]
    networks: [alxarafe]

volumes:
  postgres-data:
  nuget-cache:
  data-protection-keys:

networks:
  alxarafe:
