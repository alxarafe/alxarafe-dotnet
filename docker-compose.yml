services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alxarafe
      POSTGRES_USER: alxarafe
      POSTGRES_PASSWORD: alxarafe_dev_only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-security.sql:ro
    healthcheck:
      # The initdb temporary server only accepts Unix-socket connections.
      # TCP readiness means initialization has finished and the final server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U alxarafe -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [alxarafe]

  app:
    image: alxarafe-dotnet-app
    build:
      context: .
      target: development
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=alxarafe;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__Security: Host=postgres;Port=5432;Database=alxarafe_security;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__AiAgent: Host=postgres;Port=5432;Database=alxarafe_ai;Username=alxarafe;Password=alxarafe_dev_only
      SecuritySeed__ReaderPassword: Reader_dev_only_123!
      SecuritySeed__CreatorPassword: Creator_dev_only_123!
      SecuritySeed__AdminEmail: ${ERBAS_CORE_ADMIN_EMAIL:-admin@example.test}
      SecuritySeed__AdminPassword: ${ERBAS_CORE_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${ERBAS_DOTNET_PORT:-48081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    networks: [alxarafe]

  validation-app:
    image: alxarafe-dotnet-app
    profiles: [validation]
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ConnectionStrings__Catalog: Host=postgres;Port=5432;Database=alxarafe_test;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__Security: Host=postgres;Port=5432;Database=alxarafe_security_test;Username=alxarafe;Password=alxarafe_dev_only
      ConnectionStrings__AiAgent: Host=postgres;Port=5432;Database=alxarafe_ai_test;Username=alxarafe;Password=alxarafe_dev_only
      SecuritySeed__ReaderPassword: Reader_dev_only_123!
      SecuritySeed__CreatorPassword: Creator_dev_only_123!
      SecuritySeed__AdminEmail: ${ERBAS_CORE_ADMIN_EMAIL:-admin@example.test}
      SecuritySeed__AdminPassword: ${ERBAS_CORE_ADMIN_PASSWORD:-}
    command: ["dotnet", "run", "--no-launch-profile", "--no-build", "--project", "src/Alxarafe.Host/Alxarafe.Host.csproj", "--urls", "http://0.0.0.0:8080"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - nuget-cache:/root/.nuget/packages
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks: [alxarafe]

  bruno:
    image: usebruno/cli:4.2.0
    profiles: [tools]
    working_dir: /workspace/api-tests/platform
    volumes:
      - .:/workspace:ro
    command: ["run", ".", "--env", "docker"]
    networks: [alxarafe]

volumes:
  postgres-data:
  nuget-cache:
  data-protection-keys:

networks:
  alxarafe:
