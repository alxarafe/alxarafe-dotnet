name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CI: true
      ERBAS_CONTRACT_DIR: ${{ github.workspace }}/erbas-contract
    steps:
      - uses: actions/checkout@v4
        with:
          path: alxarafe-dotnet
      - uses: actions/checkout@v4
        with:
          repository: alxarafe/erbas-contract
          ref: 5f814dfb21732ba20c31c66bf62e66caadbdda58
          path: erbas-contract
      - name: Validate native, module and shared-contract suites
        working-directory: alxarafe-dotnet
        run: ./bin/check
